name: Build & Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build production app
        id: build_app
        env:
          DAIHON_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.DAIHON_KEYSTORE_BASE64 || '' }}
          DAIHON_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DAIHON_KEYSTORE_PASSWORD || '' }}
        run: |
          if [ -n "$DAIHON_KEYSTORE_BASE64" ]; then
            umask 077
            export DAIHON_KEYSTORE_PATH="$RUNNER_TEMP/daihon-release.p12"
            trap 'rm -f "$DAIHON_KEYSTORE_PATH"' EXIT
            printf '%s' "$DAIHON_KEYSTORE_BASE64" | base64 --decode > "$DAIHON_KEYSTORE_PATH"
          fi
          ./gradlew :app:assembleRelease
          daihon_version=$(jq -r '.elements[] | select(.type == "UNIVERSAL") | .versionName' app/build/outputs/apk/release/output-metadata.json)
          printf 'version=%s\n' "$daihon_version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Daihon-${{ steps.build_app.outputs.version }}
          path: app/build/outputs/apk/release/app-universal-release*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
